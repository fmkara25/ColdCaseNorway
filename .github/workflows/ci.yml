name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coldcase_test
          POSTGRES_USER: coldcase
          POSTGRES_PASSWORD: ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coldcase -d coldcase_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_CONNECTION: Host=localhost;Database=coldcase_test;Username=coldcase;Password=ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/ColdCase.slnx
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project backend/ColdCase.Infrastructure
      - run: dotnet ef migrations script --idempotent --project backend/ColdCase.Infrastructure --output migrations.sql
      - run: dotnet test backend/ColdCase.slnx --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
  containers:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: coldcase-ci
      # Synthetic CI-only credential; punctuation verifies password is not parsed as connection syntax.
      POSTGRES_PASSWORD: "ci-only;quote'test"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml -f compose.play.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.play.yaml up -d --build --wait --wait-timeout 180
      - name: Verify non-root app images
        run: |
          for service in api web; do
            uid=$(docker compose -f compose.yaml -f compose.play.yaml exec -T "$service" id -u)
            test "$uid" -ne 0
          done
      - run: python3 scripts/container-smoke.py write "$RUNNER_TEMP/coldcase.cookies"
      - name: Recreate stack without removing its database volume
        run: |
          docker compose -f compose.yaml -f compose.play.yaml down
          docker compose -f compose.yaml -f compose.play.yaml up -d --wait --wait-timeout 180
      - run: python3 scripts/container-smoke.py read "$RUNNER_TEMP/coldcase.cookies"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.container.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-visual-review
          path: |
            frontend/test-results/desk-*/**/*.png
            frontend/test-results/interviews-*/**/*.png
            frontend/test-results/comparison-*/**/*.png
            frontend/test-results/timeline-*/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Container diagnostics
        if: failure()
        run: docker compose -f compose.yaml -f compose.play.yaml logs --no-color --tail 150
      - name: Stop isolated CI stack
        if: always()
        run: docker compose -f compose.yaml -f compose.play.yaml down
