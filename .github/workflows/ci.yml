name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coldcase_test
          POSTGRES_USER: coldcase
          POSTGRES_PASSWORD: ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coldcase -d coldcase_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_CONNECTION: Host=localhost;Database=coldcase_test;Username=coldcase;Password=ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/ColdCase.slnx
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project backend/ColdCase.Infrastructure
      - run: dotnet ef migrations script --idempotent --project backend/ColdCase.Infrastructure --output migrations.sql
      - run: dotnet test backend/ColdCase.slnx --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
  containers:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: coldcase-ci
      # Synthetic CI-only credential; punctuation verifies password is not parsed as connection syntax.
      POSTGRES_PASSWORD: "ci-only;quote'test"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.yaml -f compose.play.yaml -f compose.ci.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.play.yaml -f compose.ci.yaml up -d --build --wait --wait-timeout 180
      - name: Verify non-root app images
        run: |
          for service in api web; do
            uid=$(docker compose -f compose.yaml -f compose.play.yaml -f compose.ci.yaml exec -T "$service" id -u)
            test "$uid" -ne 0
          done
      - run: python3 scripts/container-smoke.py write "$RUNNER_TEMP/coldcase.cookies"
      - name: Recreate stack without removing its database volume
        run: |
          docker compose -f compose.yaml -f compose.play.yaml -f compose.ci.yaml down
          docker compose -f compose.yaml -f compose.play.yaml -f compose.ci.yaml up -d --wait --wait-timeout 180
      - run: python3 scripts/container-smoke.py read "$RUNNER_TEMP/coldcase.cookies"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.container.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desk-visual-review
          path: |
            frontend/test-results/desk-*/**/*.png
            frontend/test-results/interviews-*/**/*.png
            frontend/test-results/comparison-*/**/*.png
            frontend/test-results/timeline-*/**/*.png
            frontend/test-results/map-*/**/*.png
            frontend/test-results/board-*/**/*.png
            frontend/test-results/reconstruction-*/**/*.png
            frontend/test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify the hosted Production image
        run: |
          docker build -f deploy/Dockerfile -t coldcase-hosted-ci .
          docker compose -f compose.yaml exec -T database psql -U coldcase -d coldcase -v ON_ERROR_STOP=1 -c 'CREATE DATABASE coldcase_hosted_ci'
          export PGPASSWORD="$POSTGRES_PASSWORD"
          export ConnectionStrings__ColdCase='Host=database;Database=coldcase_hosted_ci;Username=coldcase'
          docker run --rm --network coldcase-ci_default -e ConnectionStrings__ColdCase -e PGPASSWORD coldcase-hosted-ci --ColdCase:Initialize=true
          docker run -d --name coldcase-hosted-ci --network coldcase-ci_default -e ConnectionStrings__ColdCase -e PGPASSWORD -p 127.0.0.1:8081:8080 coldcase-hosted-ci
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs coldcase-hosted-ci; fi; docker rm -f coldcase-hosted-ci >/dev/null' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 --max-time 5 -sS http://localhost:8081/api/health >/dev/null
          curl -fsS http://localhost:8081/api/cases | python3 -c 'import json,sys; assert any(case["id"] == "1999-1218" for case in json.load(sys.stdin))'
          curl -fsS http://localhost:8081/play/1999-1218 | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/missing)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/openapi/v1.json)" = 404
      - name: Container diagnostics
        if: failure()
        run: docker compose -f compose.yaml -f compose.play.yaml -f compose.ci.yaml logs --no-color --tail 150
      - name: Stop isolated CI stack
        if: always()
        run: docker compose -f compose.yaml -f compose.play.yaml -f compose.ci.yaml down
